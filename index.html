<script>
const no = document.getElementById("no");

function moveButton() {
    const x = Math.random() * (window.innerWidth - no.offsetWidth);
    const y = Math.random() * (window.innerHeight - no.offsetHeight);

    no.style.position = "fixed";
    no.style.left = x + "px";
    no.style.top = y + "px";
}

// No button har 400ms me move hoga
setInterval(moveButton, 400);

function yes() {
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#ffb6c1;">
        <h1 style="font-size:50px;color:white;">Yayyyy! ❤️🥰</h1>
        <h2>I Love You Forever 💍❤️</h2>
    </div>`;
}
</script>
