<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Girlfriend? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
}
.container{
text-align:center;
color:white;
}
h1{
font-size:42px;
margin-bottom:30px;
text-shadow:2px 2px 10px rgba(0,0,0,.3);
}
button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
margin:15px;
transition:.3s;
}
#yes{
background:#00c853;
color:white;
}
#no{
background:#ff1744;
color:white;
position:fixed;
}.container p{
font-size:20px;
margin-bottom:20px;
}
.heart{
position:fixed;
top:-50px;
font-size:25px;
animation:fall linear forwards;
pointer-events:none;
}
@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">
<h1>💖 Will You Be My Girlfriend? 💖</h1>
<p>You are the most special person in my life ❤️</p>

<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>
</div>

<script>
const no=document.getElementById("no");
const yes=document.getElementById("yes");

function moveNo(){
const x=Math.random()*(window.innerWidth-no.offsetWidth);
const y=Math.random()*(window.innerHeight-no.offsetHeight);

no.style.left=x+"px";
no.style.top=y+"px";
}

setInterval(moveNo,400);

function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);

yes.onclick=function(){document.body.innerHTML=`
<div style="height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#ff4e8a,#ff99cc);
color:white;
text-align:center;
overflow:hidden;">

<h1 style="font-size:60px;animation:pop 1s infinite alternate;">
🎉 SHE SAID YES! 🎉
</h1>

<h2 style="font-size:35px;margin-top:20px;">
❤️ I Love You Forever ❤️
</h2>

<p style="font-size:22px;margin-top:15px;">
💍 You Made Me The Happiest Person 💖
</p>

<div id="celebrate"></div>

<style>
@keyframes pop{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

.confetti{
position:fixed;
top:-20px;
font-size:30px;
animation:drop linear forwards;
}

@keyframes drop{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}
</style>
`;

setInterval(()=>{
const c=document.createElement("div");
c.className="confetti";
c.innerHTML=["🎉","❤️","💖","💍","✨","🥰"][Math.floor(Math.random()*6)];
c.style.left=Math.random()*100+"vw";
c.style.animationDuration=(Math.random()*2+2)+"s";
document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},4000);

},100);

};

</script>

</body>
</html>
