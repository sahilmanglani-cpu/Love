<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Girlfriend? ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
overflow:hidden;
}

.container{
text-align:center;
}

h1{
color:white;
font-size:40px;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
margin:15px;
}

#yes{
background:#00c853;
color:white;
}

#no{
background:#ff1744;
color:white;
position:fixed;
}

.heart{
position:fixed;
top:-20px;
font-size:25px;
animation:fall 5s linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="container">
<h1>💖 Will You Be My Girlfriend? 💖</h1>

<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>
</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");

function moveNo(){
let x=Math.random()*(window.innerWidth-no.offsetWidth);
let y=Math.random()*(window.innerHeight-no.offsetHeight);

no.style.left=x+"px";
no.style.top=y+"px";
}

setInterval(moveNo,400);

setInterval(function(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

document.body.appendChild(h);

setTimeout(()=>h.remove(),5000);

},300);

yes.onclick=function(){

document.body.innerHTML=`
<div style="height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;background:#ff5fa2;color:white;text-align:center;">
<h1 style="font-size:60px;">🎉 Yayyyy! 🎉</h1>
<h2>❤️ I Love You Forever ❤️</h2>
<h3>💍 You Made My Day 💖</h3>
</div>`;
};

</script>

</body>
</html>
